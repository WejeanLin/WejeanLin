<svg width="360" height="42" viewBox="0 0 360 42" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Small terminal cursor animation</title>
  <desc id="desc">A small terminal prompt that echoes the learning line above.</desc>
  <style>
    :root {
      color-scheme: light dark;
    }

    .line {
      stroke: #d8dee9;
      stroke-width: 1;
      stroke-linecap: round;
      opacity: 0.7;
    }

    .prompt,
    .text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      letter-spacing: 0;
    }

    .prompt {
      fill: #8b9dab;
    }

    .text {
      fill: #64748b;
    }

    .cursor {
      fill: #8b9dab;
      animation: blink 1.1s steps(1, end) infinite;
    }

    .dot {
      fill: #8b9dab;
      opacity: 0.25;
      animation: pulse 2.4s ease-in-out infinite;
    }

    .dot:nth-of-type(2) {
      animation-delay: 0.3s;
    }

    .dot:nth-of-type(3) {
      animation-delay: 0.6s;
    }

    @media (prefers-color-scheme: dark) {
      .line {
        stroke: #263241;
      }

      .prompt,
      .cursor,
      .dot {
        fill: #94a3b8;
      }

      .text {
        fill: #a8b4c5;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor,
      .dot {
        animation: none;
      }
    }

    @keyframes blink {
      0%,
      48% {
        opacity: 1;
      }

      49%,
      100% {
        opacity: 0;
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.22;
      }

      50% {
        opacity: 0.82;
      }
    }
  </style>

  <line class="line" x1="24" y1="8" x2="336" y2="8" />
  <text class="prompt" x="78" y="29">&gt;</text>
  <text class="text" x="98" y="29">keep learning</text>
  <rect class="cursor" x="206" y="17" width="7" height="15" rx="1" />
  <circle class="dot" cx="236" cy="24" r="2.2" />
  <circle class="dot" cx="250" cy="24" r="2.2" />
  <circle class="dot" cx="264" cy="24" r="2.2" />
</svg>
